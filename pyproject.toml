[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spltz-viur-light-mock"
dynamic = ["version"]
description = "Pytest helpers and viur-core stand-ins for testing ViUR packages without App Engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Andreas H. Kelch" },
]
keywords = ["viur", "testing", "pytest", "mocks", "stubs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "pytest>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest-cov~=5.0",
    "coverage[toml]~=7.0",
]
# Overlay mode runs against a *real* viur-core, so testing it needs one
# installed. Kept in its own extra ON PURPOSE, never folded into `test`: the
# pytest plugin picks its mode from whether viur.core is importable in the
# environment (see README, "Overlay mode"). Installing viur-core alongside the
# fake-mode tests would switch the whole environment to overlay mode and leave
# `tests/` without the stand-ins it exists to exercise.
#
# One environment, one mode. Run the two test roots in sequence:
#   pip install -e .[test]           && coverage run    -m pytest tests
#   pip install -e .[test,overlay]   && coverage run -a -m pytest tests_overlay
# ``-a`` appends, so the 100% gate sees both runs added together.
overlay = [
    "viur-core==3.9.0.dev6",
]
dev = [
    "spltz-viur-light-mock[test]",
    "build~=1.2",
]

[project.entry-points.pytest11]
viur_light_mock = "viur.light_mock.plugin"

[project.urls]
Homepage = "https://github.com/sprengplatz/viur-light-mock"
Repository = "https://github.com/sprengplatz/viur-light-mock.git"
"Bug Tracker" = "https://github.com/sprengplatz/viur-light-mock/issues"
Changelog = "https://github.com/sprengplatz/viur-light-mock/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "viur.light_mock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["viur.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# IMPORTANT: this package *is* the pytest plugin under test. pytest-cov starts
# instrumenting *after* entry-point plugins are imported, so its measurement of
# ``viur.light_mock.plugin`` would be incomplete. Instead, run the test suite
# through ``coverage run -m pytest`` (CI does this) and call
# ``coverage report --fail-under=100`` to enforce the gate. Locally,
# ``coverage run -m pytest && coverage report`` works the same way.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # Everything below is the price of importing a real viur-core into a suite
    # that treats warnings as errors: its dependency chain warns, and those
    # warnings are not ours to fix. Each entry is scoped to one message so any
    # *other* warning still fails the run. Both are Python-3.12-only, which is
    # why they only ever showed up in CI.
    #
    # viur-core 3.9.0.dev6 has an unescaped ``\d`` in a config.py docstring. Since
    # 3.12 that is a SyntaxWarning, and as an error it becomes a SyntaxError at
    # compile time — viur-core is then unimportable and the whole overlay root
    # dies at collection. Only reproducible on a cold bytecode cache. Scoping it
    # to the module does not work: a compile-time SyntaxWarning is not attributed
    # to ``viur.core.config``. So this one also covers our own source, and the
    # package runs no linter that would catch the same mistake — worth knowing.
    "ignore:invalid escape sequence:SyntaxWarning",
    # webob imports the stdlib ``cgi`` module (webob/compat.py), reached via
    # viur.core.request. On 3.13 stdlib ``cgi`` is gone and ``legacy-cgi`` stands
    # in without warning; on 3.12 it is still there and deprecated.
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["viur.light_mock"]
# Run as: ``coverage run -m pytest`` (so plugin import is instrumented).

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if t\\.TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
